name: CI - Build and Test

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Antlers.UnitTests/Antlers.UnitTests.csproj --no-build --configuration Release --logger trx

      - name: Run integration tests
        run: dotnet test Antlers.IntegrationTests/Antlers.IntegrationTests.csproj --no-build --configuration Release --logger trx